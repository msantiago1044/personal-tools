name: Compilar y Publicar APK Android Automáticamente

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_SUPABASE_URL: "https://phczdxbtquxwfqnrakcz.supabase.co"
      EXPO_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_ThVP291edlMvGoeLw2182w_sb7hmslN"

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Instalar dependencias de mobile
        working-directory: mobile
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: ⚙️ Generar proyecto nativo Android (Expo Prebuild)
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --clean

      - name: 🔧 Configurar firma release para APK Standalone
        working-directory: mobile/android
        run: |
          # Asegurar que el build type release use la firma debug para que el APK sea autónomo e instalable directamente
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle || true

      - name: 🔨 Compilar APK Release Autónomo con Gradle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📋 Preparar artefacto APK final
        run: |
          mkdir -p build-output
          APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Copiando APK: $APK_PATH"
          cp "$APK_PATH" build-output/PersonalTools.apk
          ls -lh build-output/

      - name: 🚀 Publicar y Reemplazar APK en GitHub Releases (Etiqueta 'latest')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Personal Tools Android (Última Versión)"
          body: |
            ### 📱 Nueva versión compilada automáticamente
            - **Fecha de compilación:** ${{ github.event.head_commit.timestamp || 'Ahora' }}
            - **Commit:** ${{ github.sha }}
            - **Mensaje:** ${{ github.event.head_commit.message }}
            
            *Este archivo se actualiza de forma automática en cada cambio de la aplicación móvil.*
          files: build-output/PersonalTools.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
